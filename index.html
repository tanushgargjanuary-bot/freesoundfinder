<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search multiple free music and sound effect sites simultaneously">
    <title>FreeSoundFinder</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f0f0f; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .container { text-align: center; max-width: 600px; width: 100%; }
        h1 { font-size: 2rem; margin-bottom: 2rem; }
        
        .search-wrapper { position: relative; width: 100%; }
        input { 
            width: 100%; 
            padding: 1rem 3rem 1rem 1rem; 
            font-size: 1.1rem; 
            border: 2px solid #333; 
            border-radius: 12px; 
            background: #1a1a1a; 
            color: #fff; 
            margin-bottom: 1rem;
            transition: border-color 0.3s ease;
        }
        input:focus { outline: none; border-color: #4CAF50; }
        
        .clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
            display: none;
            width: auto;
        }
        .clear-btn:hover { color: #fff; }
        .clear-btn.visible { display: block; }
        
        button { 
            width: 100%; 
            padding: 1rem 2rem; 
            font-size: 1.1rem; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        button:hover:not(:disabled) { background: #45a049; transform: translateY(-2px); }
        button:active:not(:disabled) { transform: translateY(0); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .history-section {
            margin-top: 1.5rem;
            text-align: left;
        }
        .history-title {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .clear-history {
            background: transparent;
            border: none;
            color: #4CAF50;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0;
            width: auto;
        }
        .clear-history:hover { text-decoration: underline; }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .history-item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .history-item:hover {
            background: #2a2a2a;
            border-color: #4CAF50;
        }
        
        .sites-info {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .site-link {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }
        .site-link:hover { color: #4CAF50; }
        .site-icon { font-size: 1rem; }
        
        .info { color: #888; margin-top: 1.5rem; font-size: 0.9rem; }
        
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Search 4 Free Asset Sites at Once</h1>
        <div class="search-wrapper">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Type music genre or sound effect..."
                aria-label="Search for music or sound effects"
                onkeypress="handleKeyPress(event)"
            >
            <button class="clear-btn" id="clearBtn" onclick="clearInput()" aria-label="Clear search">✕</button>
        </div>
        <button id="searchBtn" onclick="searchAll()">
            <span id="btnText">Search All Sites</span>
        </button>
        
        <div class="history-section" id="historySection" style="display: none;">
            <div class="history-title">
                <span>Recent Searches</span>
                <button class="clear-history" onclick="clearHistory()">Clear All</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
        
        <div class="sites-info">
            <a href="https://pixabay.com/music/" target="_blank" class="site-link" title="Pixabay Music">
                <span class="site-icon">🖼️</span> Pixabay
            </a>
            <a href="https://mixkit.co/" target="_blank" class="site-link" title="Mixkit">
                <span class="site-icon">🎬</span> Mixkit
            </a>
            <a href="https://freesound.org/" target="_blank" class="site-link" title="Freesound">
                <span class="site-icon">🔊</span> Freesound
            </a>
            <a href="https://studio.youtube.com/music" target="_blank" class="site-link" title="YouTube Audio Library">
                <span class="site-icon">📺</span> YouTube
            </a>
        </div>
    </div>

    <script>
        const SITES = [
            { name: 'Pixabay', url: (q) => `https://pixabay.com/music/search/${q}` },
            { name: 'Mixkit', url: (q) => `https://mixkit.co/free-stock-music/${q}` },
            { name: 'Freesound', url: (q) => `https://freesound.org/search/?q=${q}` },
            { name: 'YouTube', url: () => 'https://studio.youtube.com/music' }
        ];
        
        const MAX_HISTORY = 5;
        let searchHistory = JSON.parse(localStorage.getItem('searchHistory') || '[]');
        
        function init() {
            renderHistory();
            updateClearButton();
            document.getElementById('searchInput').addEventListener('input', updateClearButton);
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchAll();
            }
        }
        
        function updateClearButton() {
            const input = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearBtn');
            clearBtn.classList.toggle('visible', input.value.length > 0);
        }
        
        function clearInput() {
            document.getElementById('searchInput').value = '';
            updateClearButton();
            document.getElementById('searchInput').focus();
        }
        
        function addToHistory(query) {
            searchHistory = searchHistory.filter(item => item !== query);
            searchHistory.unshift(query);
            if (searchHistory.length > MAX_HISTORY) {
                searchHistory.pop();
            }
            localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
            renderHistory();
        }
        
        function renderHistory() {
            const section = document.getElementById('historySection');
            const list = document.getElementById('historyList');
            
            if (searchHistory.length === 0) {
                section.style.display = 'none';
                return;
            }
            
            section.style.display = 'block';
            list.innerHTML = searchHistory.map((item, index) => 
                `<div class="history-item fade-in" onclick="useHistoryItem('${escapeHtml(item)}')" role="button" tabindex="0" 
                 onkeypress="if(event.key==='Enter') useHistoryItem('${escapeHtml(item)}')">
                    ${escapeHtml(item)}
                 </div>`
            ).join('');
        }
        
        function useHistoryItem(query) {
            document.getElementById('searchInput').value = query;
            searchAll();
        }
        
        function clearHistory() {
            searchHistory = [];
            localStorage.removeItem('searchHistory');
            renderHistory();
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function setLoading(isLoading) {
            const btn = document.getElementById('searchBtn');
            const btnText = document.getElementById('btnText');
            
            if (isLoading) {
                btn.disabled = true;
                btnText.innerHTML = '<span class="loading-spinner"></span>Opening...';
            } else {
                btn.disabled = false;
                btnText.textContent = 'Search All Sites';
            }
        }
        
        function searchAll() {
            const input = document.getElementById('searchInput');
            const query = input.value.trim();
            if (!query) {
                input.focus();
                return;
            }
            
            setLoading(true);
            addToHistory(query);
            
            const encoded = encodeURIComponent(query);
            
            setTimeout(() => {
                SITES.forEach(site => {
                    const url = site.url(encoded);
                    window.open(url, '_blank', 'noopener,noreferrer');
                });
                setLoading(false);
            }, 300);
        }
        
        // Initialize on load
        init();
    </script>
</body>
</html>
